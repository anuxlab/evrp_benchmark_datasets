name: EVRP dataset smoke tests

on:
  workflow_dispatch:
    inputs:
      run_full_corpus:
        description: Inspect every committed instance (otherwise inspect two examples per file format)
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: evrp-dataset-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Parser and provenance registry tests
        run: PYTHONPATH=src pytest -q
      - name: Validate source registry
        run: PYTHONPATH=src python -c "from pathlib import Path; from evrp_bench.registry import load_registry, validate_registry; p=Path('data/registry/evrp_dataset_registry.json'); e=validate_registry(load_registry(p)); print('Registry validation passed' if not e else '\n'.join(e)); raise SystemExit(bool(e))"
      - name: Inspect full benchmark corpus
        if: inputs.run_full_corpus == 'true'
        run: PYTHONPATH=src python -m evrp_bench.runner --data data/raw --out reports
      - name: Inspect representative smoke subset
        if: inputs.run_full_corpus == 'false'
        run: PYTHONPATH=src python -m evrp_bench.runner --data data/raw --out reports --sample
      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evrp-dataset-validation-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
