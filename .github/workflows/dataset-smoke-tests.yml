name: EVRP dataset smoke tests

on:
  workflow_dispatch:
    inputs:
      run_full_corpus:
        description: Inspect every locally available instance (otherwise representative examples)
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  issues: write

concurrency:
  group: evrp-dataset-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Checkout cleans the workspace; create output directories afterwards.
      - name: Create log directories
        run: mkdir -p reports runner-logs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip pytest 2>&1 | tee runner-logs/01-install.txt

      - name: Parser, provenance and registry tests
        run: |
          set -o pipefail
          PYTHONPATH=src pytest -vv 2>&1 | tee runner-logs/02-pytest.txt

      - name: Validate source registry
        run: |
          set -o pipefail
          PYTHONPATH=src python -c "from pathlib import Path; from evrp_bench.registry import load_registry, validate_registry; e=validate_registry(load_registry(Path('data/registry/evrp_dataset_registry.json'))); print('Registry validation passed' if not e else '\n'.join(e)); raise SystemExit(bool(e))" 2>&1 | tee runner-logs/03-registry.txt

      - name: Inspect full local corpus
        if: inputs.run_full_corpus == 'true'
        run: |
          set -o pipefail
          PYTHONPATH=src python -m evrp_bench.runner --data data/raw --out reports --dataset all --problem-variant all --instance-mode all 2>&1 | tee runner-logs/04-inspection.txt

      - name: Inspect representative subset
        if: inputs.run_full_corpus == 'false'
        run: |
          set -o pipefail
          PYTHONPATH=src python -m evrp_bench.runner --data data/raw --out reports --dataset all --problem-variant all --instance-mode representative 2>&1 | tee runner-logs/04-inspection.txt

      - name: Upload reports and runner logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evrp-smoke-${{ github.run_number }}
          path: |
            reports/
            runner-logs/
          if-no-files-found: warn
          retention-days: 90

      - name: Open labelled issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const labels = [
              {name:"datasets", color:"1D76DB", description:"EVRP dataset acquisition, parsing or validation"},
              {name:"ci-failure", color:"B60205", description:"Continuous integration failure"},
              {name:"workflow-failure", color:"D93F0B", description:"GitHub Actions workflow failed"}
            ];
            for (const label of labels) {
              try { await github.rest.issues.getLabel({...context.repo, name:label.name}); }
              catch { await github.rest.issues.createLabel({...context.repo, ...label}); }
            }
            const title = `[CI] EVRP smoke tests failed — run ${context.runNumber}`;
            const open = await github.rest.issues.listForRepo({...context.repo, state:"open", per_page:100});
            if (!open.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                ...context.repo, title,
                body: `Workflow failed. Review run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}\nDownload the workflow artifact for pytest output, parser logs and reports.`,
                labels:["datasets","ci-failure","workflow-failure"]
              });
            }
