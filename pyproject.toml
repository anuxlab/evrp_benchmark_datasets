[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evrp-benchmark-lab"
version = "0.1.0"
description = "EVRP benchmark dataset inspection and smoke-testing pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]
