[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evrp-benchmark-lab"
version = "0.4.0"
description = "Provenance-first EVRP benchmark dataset catalogue, parsers and validation workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evrp-bench = "evrp_bench.runner:main"

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]
